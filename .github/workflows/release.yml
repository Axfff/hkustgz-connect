name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: npm --prefix desktop ci
      - run: npm run check
      - run: cargo +1.97.1 test --locked --manifest-path engine/Cargo.toml
      - run: bash desktop/scripts/build-engine.sh
      - name: Build app artifacts
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --arm64
      - run: bash scripts/build-cli.sh
      - run: bash scripts/package-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/hkustgzconnect-$version-mac-arm64.dmg" \
            "dist/hkustgzconnect-$version-mac-arm64.zip" \
            "dist/hkustgz-connect-cli-$version-macos-arm64.tar.gz" \
            dist/SHA256SUMS.txt \
            --title "HKUST(GZ) Connect $version" \
            --generate-notes
